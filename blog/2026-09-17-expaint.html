<p>是的，指针当然表现得像有符号数一样。</p>
<p>于是我试着点开 jajuju 发的代码中，长度只有五个字符的 <code>expaint</code> 函数名，去一探 <code>offsetof</code> 的究竟。</p>

<h2 id="sec-1">1 醒了过来</h2>
<p>打开 <code>cppreference</code> 试着查找……等等，不用找了。<code>offsetof</code> 返回的是偏移量不是差，返回类型肯定是 <code>size_t</code> 而不是什么 <code>offset_t</code>。有符号的东西是 <code>ptrdiff_t</code>。</p>
